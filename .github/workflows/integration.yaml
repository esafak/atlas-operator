name: Integration Tests
on:
  push:
    branches:
      - dev
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"
      - name: Install verified Atlas fork CLI
        uses: ./.github/actions/setup-atlas
        with:
          repository: esafak/atlas
          release: dev
          commit: 11eba1dd5793a6c869e667ffbe8d49fc72c498a4
          asset-base: https://github.com/esafak/atlas/releases/download/dev
          amd64-sha256: 70a5e4b509832d4068ba537d0a1b0c05f302d68c771382613f5676efa9236cda
          arm64-sha256: 5838d36d4dbb8f131019b03d69c44fdcacbde82787cd2af4edbd88b1261b2eed
          cosign-version: v2.6.3
          cosign-identity: '^https://github\.com/esafak/atlas/\.github/workflows/cli-prerelease_oss\.yaml@refs/heads/dev$'
          cosign-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Check Atlas pin consistency
        run: make check-atlas-pin
      - name: Generate
        run: |
          make cli-gen
      - name: Run Go mod tidy
        run: go mod tidy
      - name: Verify generated files are checked in properly
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "you need to run 'make cli-gen' and commit the changes"
            echo "$status"
            exit 1
          fi
      - name: Run tests
        run: |
          make test
  e2e:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: "go.mod"
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/v2.19.0/skaffold-linux-amd64 && \
          sudo install skaffold /usr/local/bin/
      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.1.4
      - name: Run e2e tests
        run: |
          make test-e2e \
            KIND_CLUSTER=chart-testing \
            TEST_RUN='(schema-hash|schema-hash-configmap|migration-mysql|schema-composite)$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: 'logs-${{ github.run_id }}-${{ github.run_attempt }}'
          path: test/e2e/logs
