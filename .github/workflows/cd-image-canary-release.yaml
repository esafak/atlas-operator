name: CD - Image Canary Release
on:
  push:
    branches:
      - dev
    paths:
      - 'Dockerfile'
      - 'Makefile'
      - 'cmd/**'
      - 'api/**'
      - 'internal/**'
      - 'charts/**'
      - '.github/workflows/cd-image-canary-release.yaml'
jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/atlas-operator
          tags: |
            type=raw,value=dev
            type=schedule
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
          labels: |
            io.ariga.atlas.version=dev-e54a654eed4814304cf4d119a5e413bc61007755
            io.ariga.atlas.channel=mutable-test
            org.opencontainers.image.title=atlas-operator
            org.opencontainers.image.description=Atlas Operator
            org.opencontainers.image.url=https://atlasgo.io
            org.opencontainers.image.vendor=Ariga
            org.opencontainers.image.source=https://github.com/esafak/atlas-operator/blob/dev/Dockerfile
      - name: Build and push
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: .
          build-args: |
            ATLAS_REPOSITORY=esafak/atlas
            ATLAS_RELEASE=dev
            ATLAS_COMMIT=e54a654eed4814304cf4d119a5e413bc61007755
            ATLAS_ASSET_BASE=https://github.com/esafak/atlas/releases/download/dev
            ATLAS_AMD64_SHA256=6edb6029e84f2cc9041d19e3d13e731d450caceff7b787e0922654163d5b73d8
            ATLAS_ARM64_SHA256=6ab57289c0334100e986089e29ffd2f0d0964167a0b5a9cbcf6163d7a61cf95d
            OPERATOR_VERSION=dev-${{ github.sha }}
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Cleanup old GHCR images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          keep-n-tagged: 5
